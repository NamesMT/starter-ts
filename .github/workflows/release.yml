name: Release (npm Trusted Publishing)

on:
  push:
    tags:
      - v*

permissions:
  contents: read
  id-token: write # required for npm provenance / OIDC

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Publishes using OIDC (no long-lived NPM_TOKEN needed).
      # Requires the package to be configured for Trusted Publishing
      # on npmjs.com (Settings > Publishing access).
      - name: Publish to npm
        run: pnpm publish --provenance --no-git-checks
